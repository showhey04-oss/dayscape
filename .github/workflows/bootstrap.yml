name: Bootstrap Dayscape source

on:
  push:
    paths:
      - ".bootstrap/trigger"

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | tr -d '\n\r' | base64 --decode > /tmp/dayscape.zip
          echo "317cbab8a6622b3994f545e07c5c239d082f8b564f21b50583c2d694a6d89ef8  /tmp/dayscape.zip" | sha256sum --check --strict
          mkdir -p /tmp/dayscape-source
          unzip -q -o /tmp/dayscape.zip -d /tmp/dayscape-source
          cp -a /tmp/dayscape-source/. .

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Dayscape v1.2 pre-release"
          git push
