name: Import Dayscape v1.2 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/trigger
          cat .bootstrap/part-* | tr -d '\n\r' | base64 --decode > /tmp/dayscape.zip
          echo "317cbab8a6622b3994f545e07c5c239d082f8b564f21b50583c2d694a6d89ef8  /tmp/dayscape.zip" | sha256sum --check --strict
          mkdir -p /tmp/dayscape-source
          unzip -q -o /tmp/dayscape.zip -d /tmp/dayscape-source
          cp -a /tmp/dayscape-source/. .

      - name: Verify expected source files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s config.js
          test -s manifest.webmanifest
          test -s service-worker.js
          test -s icons/apple-touch-icon.png
          test -s icons/icon-192.png
          test -s icons/icon-512.png
          test -s icons/icon-maskable-512.png
          grep -q 'googleMapsApiKey: ""' config.js

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap
          rm -f .github/workflows/import-dayscape.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Dayscape v1.2 pre-release"
          git push
